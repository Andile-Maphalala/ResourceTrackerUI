<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResourceTrackerUI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />

    <!-- Tailwind MUST come before MudBlazor -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Tailwind config: plain <script> tag, NOT importmap -->
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#57f1db",
                        "on-primary": "#003731",
                        "primary-container": "#2dd4bf",
                        "on-primary-container": "#00574d",
                        "secondary": "#ffb690",
                        "secondary-container": "#ec6a06",
                        "on-secondary-container": "#4a1c00",
                        "tertiary": "#cbdaff",
                        "tertiary-container": "#a0beff",
                        "surface": "#0b1326",
                        "surface-dim": "#0b1326",
                        "surface-bright": "#31394d",
                        "surface-container-lowest": "#060e20",
                        "surface-container-low": "#131b2e",
                        "surface-container": "#171f33",
                        "surface-container-high": "#222a3d",
                        "surface-container-highest": "#2d3449",
                        "surface-variant": "#2d3449",
                        "on-surface": "#dae2fd",
                        "on-surface-variant": "#bacac5",
                        "outline": "#859490",
                        "outline-variant": "#3c4a46",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "background": "#0b1326",
                        "on-background": "#dae2fd",
                        "inverse-surface": "#dae2fd",
                        "inverse-on-surface": "#283044",
                        "inverse-primary": "#006b5f",
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem",
                    },
                    fontFamily: {
                        body: ["Inter", "sans-serif"],
                        "body-sm": ["Inter", "sans-serif"],
                        "label-caps": ["Space Grotesk", "sans-serif"],
                        "data-mono": ["Space Grotesk", "sans-serif"],
                        h1: ["Inter", "sans-serif"],
                        h2: ["Inter", "sans-serif"],
                        h3: ["Inter", "sans-serif"],
                    },
                    fontSize: {
                        "body-sm": ["12px", { lineHeight: "1.5", fontWeight: "400" }],
                        "label-caps": ["11px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "600" }],
                        "data-mono": ["14px", { lineHeight: "1", fontWeight: "500" }],
                        "body": ["14px", { lineHeight: "1.5", fontWeight: "400" }],
                        "h3": ["18px", { lineHeight: "1.4", fontWeight: "600" }],
                        "h2": ["24px", { lineHeight: "1.3", fontWeight: "600" }],
                        "h1": ["32px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "700" }],
                    },
                    spacing: {
                        "margin-page": "32px",
                        gutter: "16px",
                        xl: "32px",
                        lg: "24px",
                        md: "16px",
                        sm: "8px",
                        xs: "4px",
                    },
                }
            }
        }
    </script>

    <!-- MudBlazor after Tailwind -->
    <link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />
    <link href="https://use.fontawesome.com/releases/v5.14.0/css/all.css" rel="stylesheet" />
    <link href="ResourceTrackerUI.styles.css" rel="stylesheet" />

    <link href="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.css" rel="stylesheet" />

    <!-- app.css last so our overrides win -->
    <link rel="stylesheet" href="css/app.css" />

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .teal-glow {
            box-shadow: 0 0 15px rgba(45, 212, 191, 0.15);
        }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js?v=1"></script>
    <script src="_content/CodeBeam.MudBlazor.Extensions/MudExtensions.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            if (main && window.innerWidth >= 1024) {
                main.style.marginLeft = '16rem';
            }
            window.addEventListener('resize', () => {
                if (main) {
                    main.style.marginLeft = window.innerWidth >= 1024 ? '16rem' : '0';
                }
            });
        });
    </script>
</body>

</html>
